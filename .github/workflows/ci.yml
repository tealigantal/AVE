name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm run media:vfr
      - run: node node_modules/electron/install.js
      - run: python -m pip install --disable-pip-version-check ruff==0.6.9 mypy==1.17.1
      - run: xvfb-run -a pnpm run check
