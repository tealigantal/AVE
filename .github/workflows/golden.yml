name: Golden and Integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm run proxy-time-map:test
      - run: pnpm run adapter:roundtrip:test
      - run: pnpm run timeline-render:test
      - run: pnpm run render-persistence:test
      - run: pnpm run storage:check

