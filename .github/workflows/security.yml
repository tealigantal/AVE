name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - name: Reject machine absolute paths
        run: |
          if git grep -n -E 'C:\\Users\\|/Users/' -- ':!docs/archive/**'; then
            echo "machine absolute path found"
            exit 1
          fi
