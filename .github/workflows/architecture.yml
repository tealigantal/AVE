name: Architecture

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run architecture
      - run: pnpm run architecture:test
      - run: pnpm run feature-boundary:test
      - run: pnpm run renderer:workbench:test
      - run: pnpm run project-api:boundary
      - run: pnpm run project-host:boundary
      - run: pnpm run ipc:boundary
      - run: pnpm run worker:boundary

