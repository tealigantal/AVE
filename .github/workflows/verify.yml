name: AVE verification implementation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - name: Reject machine absolute paths
        run: |
          if git grep -n -E 'C:\\Users\\|/Users/' -- \
            ':!docs/archive/**' \
            ':!.github/workflows/verify.yml' \
            ':!docs/evidence/runs/EVD-20260805-WP-VLOG-002-PRECHECK.md' \
            ':!docs/evidence/runs/EVD-20260805-WP-VLOG-002-COMPLETE.md'; then
            echo "machine absolute path found"
            exit 1
          fi

  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm run media:vfr
      - run: node node_modules/electron/install.js
      - run: python -m pip install --disable-pip-version-check ruff==0.6.9 mypy==1.17.1
      - run: xvfb-run -a pnpm run check
      - run: pnpm run acceptance:final:synthetic
